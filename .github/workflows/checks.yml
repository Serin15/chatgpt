name: PULSE checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.23
      - run: uv sync --frozen
      - run: uv run ruff check app tests
      - name: Unit and integration tests
        shell: python
        run: |
          import os
          import subprocess
          import sys

          # Windows redirects stdout using cp1252 by default. Preserve Romanian diagnostics.
          sys.stdout.reconfigure(encoding="utf-8", errors="replace")
          sys.stderr.reconfigure(encoding="utf-8", errors="replace")
          result = subprocess.run(
              ["uv", "run", "pytest", "-q"],
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              encoding="utf-8",
              errors="replace",
              env=os.environ | {"PYTHONIOENCODING": "utf-8"},
          )
          print(result.stdout, flush=True)
          if result.returncode:
              detail = result.stdout[-24000:].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print("::error title=Pytest failure::" + detail, flush=True)
          sys.exit(result.returncode)
      - run: node --check app/static/app.js
      - run: node --check app/static/advanced.js
      - run: node --check app/static/opportunities.js
      - name: Chromium audit regressions with isolated providers
        if: runner.os == 'Linux'
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/memescope-ui-audit" --no-audit --no-fund axe-core@4.14.0
          export BROWSER_AXE_PATH="$RUNNER_TEMP/memescope-ui-audit/node_modules/axe-core/axe.min.js"
          uv run --with playwright playwright install --with-deps chromium
          uv run --with playwright python - <<'PY'
          import os
          import subprocess
          import sys
          from playwright.sync_api import sync_playwright

          with sync_playwright() as browser:
              subprocess.run(
                  [sys.executable, "tests/browser_audit.py"],
                  env=os.environ | {"BROWSER_EXECUTABLE": browser.chromium.executable_path},
                  check=True,
              )
              subprocess.run(
                  [sys.executable, "tests/browser_interface.py"],
                  env=os.environ | {"BROWSER_EXECUTABLE": browser.chromium.executable_path},
                  check=True,
              )
          PY
      - name: Native Windows launcher from a path with spaces
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $project = Join-Path $env:RUNNER_TEMP 'PULSE test path'
          New-Item -ItemType Directory -Force $project | Out-Null
          $archive = Join-Path $env:RUNNER_TEMP 'pulse-check.zip'
          git archive --format=zip --output=$archive HEAD
          Expand-Archive -Path $archive -DestinationPath $project -Force
          $env:PULSE_NO_BROWSER = '1'
          $env:DATA_DIR = Join-Path $env:RUNNER_TEMP 'PULSE temporary data'
          $process = Start-Process cmd -ArgumentList '/c start-windows.cmd' -WorkingDirectory $project -PassThru
          try {
            $ready = $false
            for ($i=0; $i -lt 120; $i++) {
              try {
                $status = Invoke-RestMethod 'http://127.0.0.1:8000/healthz'
                if ($status.app_id -eq 'pulse_crypto_research') { $ready = $true; break }
              } catch {}
              Start-Sleep -Seconds 1
            }
            if (-not $ready) { throw 'Native Windows launcher did not become ready' }
          } finally {
            taskkill /PID $process.Id /T /F 2>$null
          }
      - name: Native Windows archival launcher and verified restore from paths with spaces
        if: runner.os == 'Windows'
        shell: python
        run: |
          import os
          import pathlib
          import subprocess
          import tempfile

          project = pathlib.Path(os.environ["RUNNER_TEMP"]) / "PULSE test path"
          with tempfile.TemporaryDirectory(prefix="MemeScope archive data ", dir=os.environ["RUNNER_TEMP"]) as data:
              env = os.environ | {"DATA_DIR": data, "PYTHONIOENCODING": "utf-8"}
              setup = "from pathlib import Path; import os; from dataclasses import replace; from decimal import Decimal; from app.config import Settings; from app.store import Store; s=Settings(data_dir=Path(os.environ['DATA_DIR'])); Store(s); Store(replace(s,data_dir=s.data_dir/'news_paper',initial_balance=Decimal(500)))"
              subprocess.run(["uv", "run", "--frozen", "python", "-c", setup], cwd=project, env=env, check=True)
              result = subprocess.run(["cmd", "/c", "archive-windows.cmd"], input="\n", cwd=project, env=env, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, encoding="utf-8", errors="replace", timeout=180)
              print(result.stdout, flush=True)
              assert result.returncode == 0, "Native archival launcher failed"
              assert '"backup_restore_verified": true' in result.stdout, "Restore verification absent"
              assert '"logical_history_identical": true' in result.stdout, "Logical preservation verification absent"
